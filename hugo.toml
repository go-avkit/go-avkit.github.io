baseURL = "https://go-avkit.github.io/"
title = "go-avkit"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[params]
  subtitle = "audio/video from pure Go, no ffmpeg"
  description = "Pure-Go (CGO=0) audio/video toolkit. Reads and writes MP4/ISO-BMFF, Matroska/WebM and MPEG-TS, reads ADTS, MP3, FLAC, Ogg, WAV and AVI, extracts an audio track as ADTS, MP3, FLAC, Ogg or WAV, and moves tracks between them without re-encoding, subtitles and metadata included; cuts a file into aligned CMAF/fMP4 and WebVTT segments for HLS and DASH, optionally encrypted with a clear key (CENC cenc and cbcs); reads the H.264, H.265, VP8 and VP9 bitstream syntax; decodes a restricted set of H.264 profiles and HEVC Main and Main 10 (4:2:0) to planar YUV. No libav/ffmpeg linkage, no external binaries."
  tagline = "A time-based media toolkit in <strong>pure Go</strong> — no <code>libav</code>, no <code>ffmpeg</code>, no external binaries."
  pills = ["CGO_ENABLED=0", "no ffmpeg linkage", "no subprocesses", "BSD-3-Clause"]
  primary_role = "containers"
  secondary_url = "https://pkg.go.dev/github.com/go-avkit/avkit"
  secondary_label = "Go reference"
  leads = [
    "Reading media in Go usually means linking <code>libav</code> or shelling out to <code>ffmpeg</code>. This does neither: it is an ordinary Go dependency that cross-compiles like the rest of your program.",
    "<strong>Reference libraries, not re-implementations.</strong> Container parsing is delegated to the maintained libraries for each format; what this adds is the mapping of their box and element trees onto <strong>one small, format-neutral model</strong>, and the conversion of what each container spells differently, so a track can be copied from one into another.",
    "<strong>One decoder, for H.264 and HEVC.</strong> <code>decode</code> turns H.264 and HEVC (Main, Main 10, 4:2:0) samples into planar YUV for the profiles it claims and refuses the rest; it also decodes FLAC, MP3 and Opus to PCM (not Vorbis, MP2 or AAC); nothing else here turns a sample into pixels or sound. The bitstream modules read the syntax and derive what it implies, which is what a tool that describes or remuxes a file needs."
  ]
  principles = "What is claimed here is what is measured to work, not the roadmap: 100% statement coverage, Windows, macOS and Linux, six 64-bit architectures including big-endian s390x, and another implementation asked the same question wherever one exists."

[[params.repos]]
  name = "avkit"
  role = "containers"
  reach = "MP4/ISO-BMFF, Matroska/WebM and MPEG-TS read and written; ADTS, MP3, FLAC, Ogg, WAV and AVI read; an audio track extracted as ADTS, MP3, FLAC, Ogg or WAV"
  gomod = true
  result = "Copies, cuts, joins and concatenates tracks with no re-encoding, carrying WebVTT, SRT, TTML, 3GPP tx3g and PGS subtitles, ALAC and TrueHD audio, chapters, edit lists, encoder priming, metadata and cover art. <code>container.Segment</code> cuts a file into aligned CMAF/fMP4 and WebVTT segments for HLS and DASH (VOD; the playlists are written by go-streamkit), and <code>container.EncryptSegments</code> encrypts them with Common Encryption (<code>cenc</code>, <code>cbcs</code>) from a key you supply; <code>media.Keys</code> states how a player gets the key, as <code>EXT-X-KEY</code> and <code>EXT-X-SESSION-KEY</code> in the HLS playlists and <code>ContentProtection</code> in the DASH manifest. <code>ConformHVC1</code> makes an HEVC file one macOS will show."

[[params.repos]]
  name = "bitstream"
  role = "bitstreams"
  reach = "what every H.264/H.265-family reader needs first"
  gomod = true
  result = "The bit reader with the formats' Exp-Golomb codes, both NAL framings, and the unescaping a payload is meaningless without."

[[params.repos]]
  name = "h264"
  role = "bitstreams"
  reach = "H.264/AVC syntax and the derivations of clause 8.2"
  gomod = true
  result = "Parameter sets and slice headers, then picture order counts, the reference picture set, the reference lists and the prediction weights."

[[params.repos]]
  name = "h265"
  role = "bitstreams"
  reach = "H.265/HEVC syntax"
  gomod = true
  result = "The NAL layer, the parameter sets, the slice segment header and the boundaries between coded pictures."

[[params.repos]]
  name = "boolcoder"
  role = "bitstreams"
  reach = "the entropy coder VP8 and VP9 share"
  gomod = true
  result = "The boolean arithmetic decoder both formats read their compressed partitions with."

[[params.repos]]
  name = "vp8"
  role = "bitstreams"
  reach = "VP8 frame tag and key-frame header"
  gomod = true
  result = "The parts of a VP8 frame that are plain bytes and bit fields."

[[params.repos]]
  name = "vp9"
  role = "bitstreams"
  reach = "VP9 uncompressed header and superframe index"
  gomod = true
  result = "The uncompressed frame header, and the superframe index that packs several frames into one sample."

[[params.repos]]
  name = "decode"
  role = "bitstreams"
  reach = "H.264 (Constrained Baseline, Baseline without FMO/ASO, Main and High 4:2:0 8-bit progressive) and HEVC (Main, Main 10, 4:2:0) decoder, plus FLAC, MP3 and Opus audio; the rest refused"
  gomod = true
  result = "Display-order planar YUV with timestamps, and <code>PosterFrame</code> for one picture without decoding the track. H.264 wraps oops1/go.264: 73 of the 81 JVT H.264.1 conformance streams give the same pictures as ffmpeg (8 refused). HEVC wraps gen2brain/h265: 143 of the 147 JCT-VC HEVC_v1 streams give the same pictures as ffmpeg, 3 more are decided by the suite's own MD5 (ours matches, ffmpeg differs) and 1 is refused by both. Audio: FLAC (mewkiz/flac, bit-exact against ffmpeg; 32-bit refused), MP3 (tphakala/go-mp3, maximum error 1.07e-6 against ffmpeg; MP2 not decoded) and Opus (pion/opus, passes all 12 RFC 8251 vectors with opus_compare; mono and stereo, 5.1 refused). Vorbis and AAC are not decoded. Since v0.5.0 an MP4 edit list is applied by default, as ffmpeg does (<code>Config.IgnoreEditList</code> returns the raw track). Slower than ffmpeg on every video input measured (v0.3.0, single core, Apple M4 Max, ffmpeg 9.0.2 with one thread): H.264 High 1080p 36.5 against 173.1 fps (0.21x), HEVC Main 10 2160p 10.3 against 27.9 fps (0.37x), the committed streams 0.21x to 0.41x; an open defect, with the hot spots mostly in the wrapped libraries. Audio speed is not measured."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 4.88:1, bright on the dark background 9.94:1.
  base = "#0079a8"
  deep = "#004a66"
  bright = "#22cce2"
  shadow = "rgba(0,121,168,.7)"
  glow = "rgba(0,121,168,.6)"
  wash = "rgba(0,121,168,.10)"
  washDeep = "rgba(0,74,102,.06)"
  chipBg = "#e4f9fc"
  chipBorder = "#bdf0f6"
  chipFg = "#004a66"
  chipBgDark = "rgba(34,204,226,.14)"
  chipBorderDark = "rgba(34,204,226,.32)"
  chipFgDark = "#85e3ef"
  statsEnd = "#caf3f8"
  bandText = "#dcf7fa"
