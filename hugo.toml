[[params.repos]]
  name = "avkit"
  role = "containers"
  reach = "MP4/ISO-BMFF, Matroska/WebM and MPEG-TS read and written; ADTS, MP3, FLAC, Ogg, WAV and AVI read; an audio track extracted as ADTS, MP3, FLAC, Ogg or WAV"
  gomod = true
  result = "Reads hostile files within bounds: since v0.17.0 a Matroska file that would unlace more frames than a track or the file may hold (or than a block has bytes for) is refused with <code>ErrReaderLimit</code> before anything is allocated, and <code>ReaderLimits</code> lowers the bounds. Copies, cuts, joins and concatenates tracks with no re-encoding, carrying WebVTT, SRT, TTML, 3GPP tx3g and PGS subtitles, ALAC and TrueHD audio, chapters, edit lists, encoder priming, metadata and cover art. <code>container.Segment</code> cuts a file into aligned CMAF/fMP4 and WebVTT segments for HLS and DASH (VOD; the playlists are written by go-streamkit), and <code>container.EncryptSegments</code> encrypts them with Common Encryption (<code>cenc</code>, <code>cbcs</code>) from a key you supply; <code>media.Keys</code> states how a player gets the key, as <code>EXT-X-KEY</code> and <code>EXT-X-SESSION-KEY</code> in the HLS playlists and <code>ContentProtection</code> in the DASH manifest. <code>ConformHVC1</code> makes an HEVC file one macOS will show."

[[params.repos]]
  name = "bitstream"
  role = "bitstreams"
  reach = "what every H.264/H.265-family reader needs first"
  gomod = true
  result = "The bit reader with the formats' Exp-Golomb codes, both NAL framings, and the unescaping a payload is meaningless without."

[[params.repos]]
  name = "h264"
  role = "bitstreams"
  reach = "H.264/AVC syntax and the derivations of clause 8.2"
  gomod = true
  result = "Parameter sets and slice headers, then picture order counts, the reference picture set, the reference lists and the prediction weights. Since v0.11.0 the decoder runs more of go-videodsp/kernels (AVX2 on amd64) with the API unchanged: whole decode of 1080p clips, one core, Apple M4 Max (indicative, load 11 to 17), alien 5.75 to 6.05 s down to 2.28 to 2.39 s and fade 2.01 to 2.13 s down to 0.82 to 0.89 s (about 2.5 times faster), framemd5 equal to ffmpeg's; still 2.3 to 2.9 times slower than ffmpeg, an open defect. Zen 4 is not re-measured."

[[params.repos]]
  name = "h265"
  role = "bitstreams"
  reach = "H.265/HEVC syntax, and since v0.14.0 an HEVC decoder of our own, with inter prediction since v0.15.0 and a public Decoder API since v0.16.0"
  gomod = true
  result = "The NAL layer, the parameter sets, the slice segment header and the boundaries between coded pictures. Since v0.14.0, the CABAC engine and the full slice-data syntax (all 52215 conformance slices walk to their last bit), intra reconstruction with deblocking and SAO (509 of 509 hashed intra pictures match their decoded picture hash SEI) and the decoded picture buffer. Since v0.15.0, inter prediction (motion data, interpolation, weighted prediction, inter residual): 7147 hashed conformance pictures verified against their decoded picture hash SEI, 6638 of them inter, 0 mismatched; the 3091 pictures of the 59 streams with no hash SEI are unverified (h265#48). Since v0.16.0 there is a public Decoder API (Decode and Flush, cropped pictures in output order, typed errors, limits on picture size and memory, VerifyHash), and a fix for a panic on a hostile SPS that affected v0.14.0 and v0.15.0. Since v0.17.0 to v0.20.0 (HEVC kernels of go-videodsp/kernels) it is faster with the output unchanged. v0.19.0 changes the output planes of Decoder.Output to read-only views. Frames per second by CPU time, one core of an AMD Ryzen 9 7950X, load 0.44 to 1.21, 2026-11-16, ffmpeg 6.1.1 with one thread, 1080p, v0.20.0: alien Main 91.2 (gen2brain/h265 87.2, ffmpeg 392.6), fade Main 82.6 (79.9, 428.2), alien8 104.0 (95.2, 431.0), alien Main 10 92.0 (30.0, 303.2). Since v0.20.0 the decoder alone is faster than gen2brain/h265 on every stream measured on x86 (1.03 to 1.09 times on 8-bit, 3.07 on Main 10) and still 0.19 to 0.30 of ffmpeg, an open defect; v0.21.0 adds Unit.Tag. v0.22.0 decodes 8-bit pictures natively into bytes with the output unchanged (md5 equal to ffmpeg's): one pinned Zen 4 core, against v0.21.0, alien Main 91.1 to 107.6 fps (+18 %), fade Main 82.2 to 95.3 (+16 %), alien8 103.9 to 125.7 (+21 %), Main 10 unchanged; Apple M4 (indicative) +1 to +8 %. v0.22.0 renames Plane.Pix to Pix16 with no alias, and an 8-bit picture carries Pix8 []uint8 instead (exactly one of the two is non-nil; Is8, At and Len read either). v0.23.0 decodes the 7 JCT-VC RExt streams that use cabac_bypass_alignment_enabled_flag (31 of 31 picture hashes match) and the base layer of the 9 MV-HEVC conformance streams (md5 of the shipped base-layer YUV on 371 pictures); speed not re-measured. decode v0.13.0 decodes HEVC with h265 v0.23.0: against v0.12.0 on the 196 JCT-VC streams, 152 identical, 0 lost, 1 more decodes and 43 are refused by both (6 of the 7 bypass-alignment streams are 4:4:4 16-bit, a format a Frame cannot carry); the 9 MV-HEVC streams decode the base layer, md5 equal to the shipped _0.yuv. decode v0.14.0 adds Frames(r, trackID, cfg), an iter.Seq2[*Frame, error] that streams one picture at a time for H.264 and HEVC (each Frame a fresh allocation the caller owns; break stops the decoding; same pictures as DecodeTrack on the 15 edit-list files, md5 equal to ffmpeg's); on Zen 4, against DecodeTrack, H.264 alien -4 %, fade -5 %, HEVC alien-main -7 %, page faults on alien 194k to 25k. h265 v0.24.0 adds an opt-in reuse of pictures, Options.RecyclePictures with (*DecodedPicture).Release(): the default is unchanged (every picture its own allocation), and a picture that is not released is never reused; h265.Decoder alone, one pinned Zen 4 core, option off to on: alien Main 104.2 to 113.9 fps (+9 %), fade Main 93.2 to 101.2 (+8 %), alien Main 10 89.2 to 100.3 (+12 %), alien8 121.1 to 124.9 (+3 %), with 3 to 5 times fewer page faults per frame; output unchanged on all 196 JCT-VC conformance streams. v0.14.0 also changes Unit.TemporalID, which returned TemporalId + 2 up to v0.13.2 and now returns TemporalId."

[[params.repos]]
  name = "boolcoder"
  role = "bitstreams"
  reach = "the entropy coder VP8 and VP9 share"
  gomod = true
  result = "The boolean arithmetic decoder both formats read their compressed partitions with."

[[params.repos]]
  name = "vp8"
  role = "bitstreams"
  reach = "VP8 frame tag and key-frame header"
  gomod = true
  result = "The parts of a VP8 frame that are plain bytes and bit fields."

[[params.repos]]
  name = "vp9"
  role = "bitstreams"
  reach = "VP9 uncompressed header and superframe index"
  gomod = true
  result = "The uncompressed frame header, and the superframe index that packs several frames into one sample."

[[params.repos]]
  name = "worker"
  role = "worker"
  reach = "poster and probe for a page that links neither a container reader nor a decoder"
  gomod = true
  result = "Latest release v0.1.2. A <code>js/wasm</code> Web Worker over go-avkit's container reader (MP4, WebM/Matroska) and its H.264 decoder: <strong>poster</strong> returns a JPEG of the frame at a time, <strong>probe</strong> returns container, codec, size and duration. A request can only lower the worker's limits, and a hostile file is refused rather than decoded."

[[params.repos]]
  name = "decode"
  role = "bitstreams"
  reach = "H.264 (Constrained Baseline, Baseline without FMO/ASO, Main and High 4:2:0 8-bit progressive) and HEVC (Main, Main 10, 4:2:0) decoder, plus FLAC, MP3 and Opus audio, and since v0.6.0 AAC-LC and HE-AAC v1 and since v0.7.0 HE-AAC v2 (full profile since v0.8.0), and since v0.9.0 linear PCM (WAVE); the rest refused, a video codec by name (<code>codec &quot;vp09&quot; is not supported</code>)"
  gomod = true
  result = "Display-order planar YUV with timestamps, and <code>PosterFrame</code> for one picture without decoding the track. H.264 wraps oops1/go.264: 73 of the 81 JVT H.264.1 conformance streams give the same pictures as ffmpeg (8 refused). Since v0.10.0 HEVC runs on our own h265 (gen2brain/h265 is gone): against v0.9.0 on the 196 JCT-VC streams, 148 decode to identical output, 0 are lost and 4 more decode; 44 are refused by both (37 formats a Frame cannot carry, 7 using cabac_bypass_alignment). Speed through DecodeTrack on 1080p, one core, against v0.9.0: x86 Ryzen 9 7950X (load 0.4 to 1.1, ffmpeg 6.1.1) Main 10 2.51 times faster, 8-bit streams 0.88 to 0.93 of v0.9.0 in v0.10.0 (the 7 to 12 % slowdown, decode#101, now closed), 0.16 to 0.25 of ffmpeg; Apple M4 Max (indicative, load above 8, ffmpeg 9.0.2) every stream faster, 1.27 to 2.79 times. Since v0.11.0, on h265 v0.22.0 (8-bit pictures decoded into bytes), no stream is slower than v0.9.0: on Zen 4 (pinned core) against v0.10.0 and v0.9.0, Main 1.23 and 1.10, fade 1.20 and 1.06, second Main 1.22 and 1.14, Main 10 1.00 and 2.51; Apple M4 (indicative) 1.00 to 1.10 against v0.10.0 and 1.43 to 2.84 against v0.9.0; the picture md5 equals ffmpeg's. Audio: FLAC (mewkiz/flac, bit-exact against ffmpeg; 32-bit refused), MP3 (tphakala/go-mp3, maximum error 1.07e-6 against ffmpeg; MP2 not decoded) and Opus (pion/opus, passes all 12 RFC 8251 vectors with opus_compare; mono and stereo, 5.1 refused). Vorbis is not decoded. Since v0.9.0, linear PCM (WAVE) decodes with its width and byte order from the pcmC record (bit-exact against ffmpeg on 6 WAVE fixtures; 64-bit float is rounded to f32le, lossy), and an unsupported video codec is refused by name with a typed error instead of being reported as a corrupt sample. Since v0.6.0: AAC-LC (written in Go from ISO/IEC 14496-3) and HE-AAC v1 (SBR) to float32 PCM, with the MP4 gapless information (<code>iTunSMPB</code>, edit lists) applied as ffmpeg does; HE-AAC v2 (Parametric Stereo) since v0.7.0, with the full profile (procedure B, IPD/OPD) by default since v0.8.0: all 7 of 7 ISO vectors match the _ur references (34-band streams keep 34 bands). Since v0.5.0 an MP4 edit list is applied by default, as ffmpeg does (<code>Config.IgnoreEditList</code> returns the raw track). Since v0.12.0 H.264 runs on h264 v0.11.0: through DecodeTrack on 1080p, one core, Apple M4 (indicative), alien 5.7 to 5.9 s down to 2.3 s and fade 2.0 s down to 0.8 s (2.5 times faster), ffmpeg still 2.3 to 2.8 times faster; Zen 4 not re-measured. Slower than ffmpeg on every video input measured (v0.3.0, before HEVC moved to h265, single core, Apple M4 Max, ffmpeg 9.0.2 with one thread): H.264 High 1080p 36.5 against 173.1 fps (0.21x), HEVC Main 10 2160p 10.3 against 27.9 fps (0.37x), the committed streams 0.21x to 0.41x; an open defect, with the hot spots mostly in the wrapped libraries. AAC speed, as a decode-only benchmark against ffmpeg's whole-process utime (Go 1.27.4, Apple M4 Max, one core, ffmpeg with one thread, load at most 6.5): 5.1 at 0.966 of ffmpeg, stereo at 0.655; HE-AAC v2 is slower, about 1.6 times ffmpeg's utime on an x86 Zen 4 core (load 0.13 to 0.93, ffmpeg 6.1.1) and about 1.1 times on an Apple M4 Max (indicative, load 7.0 to 7.7, ffmpeg 9.0.2), an open defect (decode#77). FLAC, MP3 and Opus speed is not measured."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 4.88:1, bright on the dark background 9.94:1.
  base = "#0079a8"
  deep = "#004a66"
  bright = "#22cce2"
  shadow = "rgba(0,121,168,.7)"
  glow = "rgba(0,121,168,.6)"
  wash = "rgba(0,121,168,.10)"
  washDeep = "rgba(0,74,102,.06)"
  chipBg = "#e4f9fc"
  chipBorder = "#bdf0f6"
  chipFg = "#004a66"
  chipBgDark = "rgba(34,204,226,.14)"
  chipBorderDark = "rgba(34,204,226,.32)"
  chipFgDark = "#85e3ef"
  statsEnd = "#caf3f8"
  bandText = "#dcf7fa"

# The architectures the tests RUN on, read from the library's CI.
[params.mantra]
  goarch = ["amd64", "arm64", "riscv64", "loong64", "ppc64le", "s390x"]
