baseURL = "https://go-avkit.github.io/"
title = "go-avkit"
disableKinds = ["taxonomy", "term", "rss", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[params]
  subtitle = "audio/video from pure Go, no ffmpeg"
  description = "Pure-Go (CGO=0) audio/video toolkit. Reads and writes MP4/ISO-BMFF, Matroska/WebM and MPEG-TS, reads ADTS, MP3, FLAC, Ogg, WAV and AVI, extracts an audio track as ADTS, MP3, FLAC, Ogg or WAV, and moves tracks between them without re-encoding, subtitles and metadata included; cuts a file into aligned CMAF/fMP4 and WebVTT segments for HLS and DASH, optionally encrypted with a clear key (CENC cenc and cbcs); reads the H.264, H.265, VP8 and VP9 bitstream syntax; decodes a restricted set of H.264 profiles and HEVC (4:0:0, 4:2:0, 4:2:2 and 4:4:4, 8 to 16 bits) to planar YUV. No libav/ffmpeg linkage, no external binaries."
  tagline = "Read, write, cut and decode time-based media — with no <code>libav</code>, no <code>ffmpeg</code> and no external binaries."
  pills = ["no ffmpeg linkage", "no subprocesses"]
  primary_role = "containers"
  leads = [
    "Reading media in Go usually means linking <code>libav</code> or shelling out to <code>ffmpeg</code>. This does neither: it is an ordinary Go dependency that cross-compiles like the rest of your program.",
    "<strong>Reference libraries, not re-implementations.</strong> Container parsing is delegated to the maintained libraries for each format; what this adds is the mapping of their box and element trees onto <strong>one small, format-neutral model</strong>, and the conversion of what each container spells differently, so a track can be copied from one into another.",
    "<strong>One decoder.</strong> <code>decode</code> turns H.264 and HEVC samples into planar YUV, and FLAC, MP3, Opus, AAC and linear PCM into PCM, for the profiles it claims; it refuses the rest. The bitstream modules read the syntax, which is what a tool that describes or remuxes a file needs. <a href=\"https://go-avkit.github.io/docs/main/decode/\">What it claims and how it was measured</a>."
  ]
  principles = "What is claimed here is what is measured to work, not the roadmap: 100% statement coverage, Windows, macOS and Linux, six 64-bit architectures including big-endian s390x, and another implementation asked the same question wherever one exists."

[[params.cta]]
  kind  = "docs"
  href  = "https://go-avkit.github.io/docs/"
  label = "Read the documentation →"

[[params.cta]]
  kind  = "github"
  href  = "https://github.com/go-avkit"
  label = "GitHub"

[[params.cta]]
  kind  = "link"
  href  = "https://pkg.go.dev/github.com/go-avkit/avkit"
  label = "Go reference"

[[params.repos]]
  name = "avkit"
  role = "containers"
  reach = "MP4, Matroska/WebM and MPEG-TS read and written; common audio formats read"
  gomod = true
  result = "Copies, cuts and joins tracks with no re-encoding, subtitles and metadata included; cuts HLS/DASH segments, optionally encrypted. Refuses hostile files within bounds. <a href=\"https://go-avkit.github.io/docs/main/modules/#module-notes\">Details</a>."

[[params.repos]]
  name = "bitstream"
  role = "bitstreams"
  reach = "what every H.264/H.265-family reader needs first"
  gomod = true
  result = "The bit reader, NAL framings and unescaping. <a href=\"https://go-avkit.github.io/docs/main/modules/#module-notes\">Details</a>."

[[params.repos]]
  name = "h264"
  role = "bitstreams"
  reach = "H.264/AVC syntax and the derivations of clause 8.2"
  gomod = true
  result = "Parameter sets, slice headers and the clause 8.2 derivations. Decoding is about 2.5 times faster since v0.11.0 but still slower than ffmpeg, an open defect. <a href=\"https://go-avkit.github.io/docs/main/modules/#module-notes\">Details</a>."

[[params.repos]]
  name = "h265"
  role = "bitstreams"
  reach = "H.265/HEVC syntax and an HEVC decoder of our own"
  gomod = true
  result = "NAL layer, parameter sets, slice headers and a conformance-verified decoder with a public Decoder API. About 0.2 to 0.3 of ffmpeg's speed on one core, an open defect. <a href=\"https://go-avkit.github.io/docs/main/history/\">Speed, versions and measurements</a>."

[[params.repos]]
  name = "boolcoder"
  role = "bitstreams"
  reach = "the entropy coder VP8 and VP9 share"
  gomod = true
  result = "The boolean arithmetic decoder both formats share."

[[params.repos]]
  name = "vp8"
  role = "bitstreams"
  reach = "VP8 frame tag and key-frame header"
  gomod = true
  result = "The frame tag and key-frame header."

[[params.repos]]
  name = "vp9"
  role = "bitstreams"
  reach = "VP9 uncompressed header and superframe index"
  gomod = true
  result = "The uncompressed frame header and the superframe index."

[[params.repos]]
  name = "worker"
  role = "worker"
  reach = "poster and probe for a page that links neither a container reader nor a decoder"
  gomod = true
  result = "A <code>js/wasm</code> Web Worker: <strong>poster</strong> returns a JPEG of a frame, <strong>probe</strong> returns container, codec, size and duration. <a href=\"https://go-avkit.github.io/docs/main/modules/#module-notes\">Details</a>."

[[params.repos]]
  name = "decode"
  role = "bitstreams"
  reach = "H.264 and HEVC decoder to planar YUV; FLAC, MP3, Opus, AAC and linear PCM to PCM"
  gomod = true
  result = "Display-order planar YUV with timestamps, <code>PosterFrame</code> for one picture, and PCM audio; anything outside the claimed profiles is refused by name. Slower than ffmpeg on every video input and on HE-AAC v2 (1.42 times ffmpeg's user time), open defects. <a href=\"https://go-avkit.github.io/docs/main/decode/\">What it claims, how it was measured</a>."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 4.88:1, bright on the dark background 9.94:1.
  base = "#0079a8"
  deep = "#004a66"
  bright = "#22cce2"
  shadow = "rgba(0,121,168,.7)"
  glow = "rgba(0,121,168,.6)"
  wash = "rgba(0,121,168,.10)"
  washDeep = "rgba(0,74,102,.06)"
  chipBg = "#e4f9fc"
  chipBorder = "#bdf0f6"
  chipFg = "#004a66"
  chipBgDark = "rgba(34,204,226,.14)"
  chipBorderDark = "rgba(34,204,226,.32)"
  chipFgDark = "#85e3ef"
  statsEnd = "#caf3f8"
  bandText = "#dcf7fa"

# The architectures the tests RUN on, read from the library's CI.
[params.mantra]
  goarch = ["amd64", "arm64", "riscv64", "loong64", "ppc64le", "s390x"]
